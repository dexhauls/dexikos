<!doctype html>
<html lang="en" class="in">
<head>
  <meta charset="utf-8">
  <!-- Bez JavaScriptu zůstává obsah vidět; s ním se schová a najede animací. -->
  <script>document.documentElement.classList.remove("in");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dex (@dex_hauls)</title>
  <meta name="description" content="Professional hauler.">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Dex (@dex_hauls)">
  <meta property="og:description" content="Professional hauler.">
  <meta property="og:image" content="https://dexikos.com/pfp.webp">
  <meta property="og:url" content="https://dexikos.com/">
  <link rel="canonical" href="https://dexikos.com/">
  <link rel="icon" href="pfp.webp">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #171717;
      --tile: #f1f2f0;
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      font-family: "DM Sans", Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background: #0d0d0d;
      color: #fff;
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: max(44px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      display: grid;
      gap: 22px;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* Profil */
    .who { display: grid; justify-items: center; text-align: center; gap: 0; }
    .who-text { display: grid; justify-items: center; }
    .avatar {
      width: 104px; height: 104px; border-radius: 999px;
      padding: 3px;
      background: conic-gradient(from 200deg, #fff, rgb(255 255 255 / .15), #fff, rgb(255 255 255 / .15), #fff);
      animation: ring 8s linear infinite;
      margin-bottom: 16px;
    }
    .avatar img { display: block; width: 100%; height: 100%; border-radius: 999px; object-fit: cover; border: 3px solid #0d0d0d; animation: ring 8s linear infinite reverse; }
    @keyframes ring { to { rotate: 360deg; } }
    h1 { margin: 0; font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -.05em; }
    .handle { margin: 6px 0 0; font-size: 15px; font-weight: 400; color: rgb(255 255 255 / .55); }
    .bio { margin: 14px 0 0; max-width: 310px; font-size: 16px; line-height: 1.45; color: rgb(255 255 255 / .82); }

    .icons { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
    .icon {
      width: 50px; height: 50px; border-radius: 999px;
      display: grid; place-items: center;
      background: rgb(255 255 255 / .07);
      border: 1px solid rgb(255 255 255 / .1);
      transition: transform .45s var(--spring), background .25s, color .25s;
    }
    .icon svg { width: 21px; height: 21px; }
    .icon:hover { background: #fff; color: var(--ink); transform: translateY(-3px) rotate(-6deg); }
    .icon:active { transform: scale(.92); }

    /* Dlaždice Dex Finds s rukou findů */
    .feature {
      position: relative; display: block;
      border-radius: 28px;
      background: rgb(255 255 255 / .06);
      border: 1px solid rgb(255 255 255 / .08);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform .45s var(--spring), background .25s;
    }
    .feature:hover { background: rgb(255 255 255 / .09); }
    .feature:active { transform: scale(.98); }
    .hand { --ch: 138px; position: relative; display: block; height: 212px; }
    .card {
      --gap: 0px; --rot: 0deg; --lift: 0px; --sc: .9;
      position: absolute; left: 50%; top: 52%;
      width: calc(var(--ch) * .78); height: var(--ch);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 30px -18px rgb(0 0 0 / .7), 0 1px 2px rgb(0 0 0 / .2);
      display: grid; place-items: center;
      opacity: 0;
      transform: translate(-50%, -50%) translateX(calc(var(--i) * var(--gap))) translateY(calc(var(--y) + 70px - var(--lift))) rotate(calc(var(--i) * var(--rot))) scale(var(--sc));
      transition: transform .7s var(--spring), opacity .5s var(--ease), filter .3s;
      transition-delay: calc(300ms + var(--k) * 70ms);
    }
    .card img { width: 88%; height: 88%; object-fit: contain; pointer-events: none; }
    .in .card { --gap: calc(var(--ch) * .35); --rot: 7deg; --sc: 1; opacity: 1; transform: translate(-50%, -50%) translateX(calc(var(--i) * var(--gap))) translateY(calc(var(--y) - var(--lift))) rotate(calc(var(--i) * var(--rot))) scale(var(--sc)); }
    .in.ready .card { transition-delay: 0ms; }
    .in.ready .feature:hover .card, .in.ready .feature.open .card { --gap: calc(var(--ch) * .45); --rot: 10deg; }
    .in.ready .feature:hover .card:not(:hover) { filter: opacity(.55); }
    .in.ready .card:hover { --lift: 20px; --sc: 1.07; z-index: 9; }
    /* A finger held on the hand and slid along it lifts the card under it, like the mouse does */
    .hand { touch-action: pan-y; }
    .feature { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .in.ready .feature.touching .card { --gap: calc(var(--ch) * .45); --rot: 10deg; transition-duration: .4s, .5s, .2s; }
    .in.ready .feature.touching .card:not(.on) { filter: opacity(.55); }
    .in.ready .card.on { --lift: 22px; --sc: 1.1; z-index: 9; }
    .feature-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 12px 12px 22px; }
    .feature-title { font-size: 20px; font-weight: 400; letter-spacing: -.02em; }
    .feature-title small { display: block; margin-top: 2px; font-size: 13px; font-weight: 300; letter-spacing: 0; color: rgb(255 255 255 / .55); }

    /* Odkazy */
    nav, .pair { display: grid; gap: 10px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      height: 64px; padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgb(255 255 255 / .16);
      font-size: 17px; font-weight: 400; letter-spacing: -.01em;
      transition: transform .45s var(--spring), background .25s;
    }
    .link:hover { background: rgb(255 255 255 / .06); }
    .link:active { transform: scale(.97); }
    .link.primary { background: #fff; color: var(--ink); border-color: #fff; }
    .ic { flex: none; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: rgb(255 255 255 / .08); }
    .primary .ic { background: var(--tile); }
    .ic svg { width: 21px; height: 21px; }
    .label { flex: 1; min-width: 0; }
    /* Join KakoBuy as a coupon: notches cut where the stub tears off, a gift on the stub, a glint now and then */
    .coupon {
      --stub: 112px; --notch: 11px;
      position: relative; display: flex; height: 78px;
      border-radius: 22px; background: #fff; color: var(--ink);
      -webkit-mask: radial-gradient(circle at calc(100% - var(--stub)) 0, #0000 var(--notch), #000 calc(var(--notch) + .5px)) top / 100% 51% no-repeat,
                    radial-gradient(circle at calc(100% - var(--stub)) 100%, #0000 var(--notch), #000 calc(var(--notch) + .5px)) bottom / 100% 51% no-repeat;
              mask: radial-gradient(circle at calc(100% - var(--stub)) 0, #0000 var(--notch), #000 calc(var(--notch) + .5px)) top / 100% 51% no-repeat,
                    radial-gradient(circle at calc(100% - var(--stub)) 100%, #0000 var(--notch), #000 calc(var(--notch) + .5px)) bottom / 100% 51% no-repeat;
      transition: transform .45s var(--spring);
    }
    .coupon::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / .9) 48%, rgb(23 23 23 / .06) 52%, transparent 65%);
      transform: translateX(-120%);
      animation: glint 5s var(--ease) 2s infinite;
    }
    @keyframes glint { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    .coupon:hover { transform: translateY(-2px) rotate(-.6deg); }
    .coupon:active { transform: scale(.97); }
    .coupon-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 12px; font-size: 18px; font-weight: 400; letter-spacing: -.01em; }
    .coupon-main .ic { width: 50px; height: 50px; background: var(--tile); }
    .coupon-main .ic img { width: 46%; height: 46%; object-fit: contain; }
    /* The mask would cut an outline away, so keyboard focus shows on the label */
    .coupon:focus-visible { outline: none; }
    .coupon:focus-visible .label { text-decoration: underline; text-underline-offset: 4px; }
    .coupon-stub {
      position: relative; flex: none; width: var(--stub);
      display: grid; justify-items: center; align-content: center; gap: 3px;
    }
    .coupon-stub::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; border-left: 2px dashed rgb(23 23 23 / .18); }
    .gift { width: 22px; height: 22px; transform-origin: 50% 80%; transition: transform .6s var(--spring); }
    .coupon:hover .gift { animation: wiggle .7s var(--ease); }
    @keyframes wiggle { 20% { transform: rotate(-14deg) scale(1.15); } 45% { transform: rotate(10deg) scale(1.15); } 70% { transform: rotate(-5deg) scale(1.08); } 100% { transform: none; } }
    .amount { font-size: 22px; font-weight: 500; line-height: 1; letter-spacing: -.04em; }
    .go { flex: none; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: rgb(255 255 255 / .08); transition: transform .5s var(--spring), background .25s, color .25s; }
    .go svg { width: 18px; height: 18px; }
    .primary .go, .feature .go { background: #fff; color: var(--ink); }
    .primary .go { background: var(--ink); color: #fff; }
    .link:hover .go, .feature:hover .go { transform: rotate(45deg); }
    .link:not(.primary):hover .go { background: #fff; color: var(--ink); }

    footer { text-align: center; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: #767676; }

    /* Vstup */
    .rise { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .8s var(--spring); transition-delay: calc(120ms + var(--d, 0) * 70ms); }
    .in .rise { opacity: 1; transform: none; }

    .glow { position: fixed; inset: -20% -20% auto; height: 70vh; background: radial-gradient(50% 50% at 50% 50%, rgb(255 255 255 / .09), transparent 70%); pointer-events: none; }

    /* Oblečení vznášející se v pozadí, hýbe se za prstem/myší */
    .float { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .float img {
      position: absolute; width: var(--w); max-width: 420px; left: var(--x); top: var(--t);
      filter: blur(var(--b)) brightness(.8);
      opacity: .38;
      transform: translate(calc(var(--px, 0) * var(--z) * 1px), calc(var(--py, 0) * var(--z) * 1px)) rotate(var(--r));
      transition: transform 1.2s var(--ease);
      animation: drift 9s ease-in-out infinite alternate; animation-delay: var(--dl);
    }
    @keyframes drift { to { translate: 0 -16px; rotate: 4deg; } }

    @media (min-width: 700px) {
      main { padding-top: 72px; }
    }

    /* Phone: everything on one screen, also inside Instagram's and TikTok's own browsers, which leave the least
       height. Photo beside the name, the finds tile takes what height is left, Discord and the old site share a row. */
    @media (max-width: 600px) {
      main {
        min-height: 100svh;
        display: flex; flex-direction: column; justify-content: center; gap: 12px;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      }
      .who { grid-template-columns: auto 1fr; justify-items: start; align-items: center; column-gap: 16px; text-align: left; }
      .who-text { justify-items: start; }
      .avatar { width: 84px; height: 84px; padding: 2px; margin: 0; }
      .avatar img { border-width: 2px; }
      h1 { font-size: 32px; }
      .handle { margin-top: 2px; font-size: 13px; }
      .bio { margin-top: 3px; font-size: 14px; }
      /* Socials as one full-width row under the photo, edges in line with the tiles below */
      .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 0; }
      .icon { width: auto; height: 44px; border-radius: 16px; }
      .icon svg { width: 19px; height: 19px; }
      .feature { border-radius: 24px; }
      .hand { --ch: clamp(84px, 14svh, 112px); height: calc(var(--ch) * 1.3 + 22px); }
      .feature-bar { padding: 0 10px 10px 18px; }
      .feature-title { font-size: 18px; }
      .feature .go { width: 40px; height: 40px; }
      .coupon { --stub: 96px; height: 66px; border-radius: 20px; }
      .coupon-main { gap: 12px; padding-left: 10px; font-size: 17px; }
      .coupon-main .ic { width: 44px; height: 44px; }
      .amount { font-size: 20px; }
      .gift { width: 20px; height: 20px; }
      .pair { grid-template-columns: 1fr 1fr; }
      .pair .link { height: 52px; gap: 10px; padding: 0 12px 0 7px; font-size: 15px; }
      .pair .ic { width: 38px; height: 38px; }
      .pair .ic svg { width: 18px; height: 18px; }
      .pair .go, .pair .long { display: none; }
      .pair .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      footer { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="float" aria-hidden="true">
    <img src="finds/maya.webp" alt="" style="--w:46vw;--x:-12vw;--t:6vh;--r:-14deg;--b:2px;--z:-1.2;--dl:-2s">
    <img src="finds/tn.webp" alt="" style="--w:50vw;--x:62vw;--t:58vh;--r:18deg;--b:1px;--z:.9;--dl:-5s">
    <img src="finds/bogo.webp" alt="" style="--w:40vw;--x:70vw;--t:-4vh;--r:12deg;--b:3px;--z:-.6;--dl:-1s">
    <img src="finds/cactus.webp" alt="" style="--w:48vw;--x:-16vw;--t:72vh;--r:-8deg;--b:2px;--z:1.4;--dl:-7s">
  </div>
  <main>
    <header class="who">
      <div class="avatar rise" style="--d:0"><img src="pfp.webp" alt="Dex" width="320" height="320"></div>
      <div class="who-text">
      <h1 class="rise" style="--d:1">Dex</h1>
      <p class="handle rise" style="--d:1">@dex_hauls</p>
      <p class="bio rise" style="--d:2">Professional hauler.</p>
      </div>
    </header>

    <div class="icons rise" style="--d:3">
      <a class="icon" href="https://www.instagram.com/dex_hauls/" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%INSTAGRAM%%"/></svg></a>
      <a class="icon" href="https://www.tiktok.com/@dex_hauls" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%TIKTOK%%"/></svg></a>
      <a class="icon" href="https://www.youtube.com/@Dex_hauls" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%YOUTUBE%%"/></svg></a>
      <a class="icon" href="https://discord.gg/dexhauls" aria-label="Discord"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%DISCORD%%"/></svg></a>
    </div>

    <a class="feature rise" href="https://update.dexfinds.com/?ref=bio" data-site style="--d:4">
      <span class="hand" aria-hidden="true">
        <span class="card" style="--i:-2;--y:18px;--k:0"><img src="finds/maya.webp" alt=""></span>
        <span class="card" style="--i:-1;--y:5px;--k:1"><img src="finds/cactus.webp" alt=""></span>
        <span class="card" style="--i:0;--y:0px;--k:2"><img src="finds/bogo.webp" alt=""></span>
        <span class="card" style="--i:1;--y:5px;--k:3"><img src="finds/tn.webp" alt=""></span>
        <span class="card" style="--i:2;--y:18px;--k:4"><img src="finds/af1.webp" alt=""></span>
      </span>
      <span class="feature-bar">
        <span class="feature-title">Dex Finds<small>All my finds and tools</small></span>
        <span class="go">%%ARROW%%</span>
      </span>
    </a>

    <nav aria-label="Links">
      <a class="coupon rise" href="https://ikako.vip/r/dexikos" rel="sponsored" style="--d:5">
        <span class="coupon-main">
          <span class="ic"><img src="kakobuy.png" alt="" width="96" height="96"></span>
          <span class="label">Join KakoBuy</span>
        </span>
        <span class="coupon-stub">
          <svg class="gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
          <span class="amount">$410</span>
        </span>
      </a>
      <div class="pair">
      <a class="link rise" href="https://discord.gg/dexhauls" style="--d:6">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%DISCORD%%"/></svg></span>
        <span class="label">Discord<span class="long"> server</span></span>
        <span class="go">%%ARROW%%</span>
      </a>
      <a class="link rise" href="https://dexfinds.com/" style="--d:7">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span>
        <span class="label">Old Dex Finds</span>
        <span class="go">%%ARROW%%</span>

      </div>

    <footer class="rise" style="--d:8">© Dex Finds</footer>
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      // ?ref= z bia (tiktok, ig…) jde dál na DexFinds, ať analytika ví, odkud návštěva přišla.
      try {
        var ref = new URLSearchParams(location.search).get("ref");
        if (ref && /^[\w-]{1,32}$/.test(ref)) {
          document.querySelectorAll("[data-site]").forEach(function (a) {
            var url = new URL(a.href); url.searchParams.set("ref", ref); a.href = url.toString();
          });
        }
      } catch (e) {}

      requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add("in"); }); });
      // Skrytá karta prohlížeče rAF nespouští; obsah se ukáže i tak.
      setTimeout(function () { root.classList.add("in"); }, 500);
      setTimeout(function () { root.classList.add("ready"); }, 1300);

      // Na telefonu bez myši se ruka po vstupu sama rozevře.
      if (matchMedia("(hover: none)").matches) {
        setTimeout(function () { document.querySelector(".feature").classList.add("open"); }, 1500);
      }

      // Prst na kartách: karta pod ním vyskočí, posun po nich přepíná. Ťuknutí dál otevře Dex Finds, posun ne.
      var feature = document.querySelector(".feature");
      var held = null, moved = false, startX = 0, startY = 0;
      var cards = [].slice.call(feature.querySelectorAll(".card"));
      // The card whose centre is nearest the finger sideways: the lifted card is larger and on top, so the one
      // "under" the finger would stick; nearest centre switches evenly along the fan.
      function cardAt(x) {
        var best = null, gap = Infinity;
        cards.forEach(function (card) {
          var r = card.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - x);
          if (d < gap) { gap = d; best = card; }
        });
        return best;
      }
      function lift(card) {
        if (card === held) return;
        if (held) held.classList.remove("on");
        held = card;
        if (card) {
          card.classList.add("on");
          if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
        }
      }
      function release() {
        feature.classList.remove("touching");
        lift(null);
      }
      feature.querySelector(".hand").addEventListener("pointerdown", function (e) {
        if (e.pointerType === "mouse") return;
        moved = false; startX = e.clientX; startY = e.clientY;
        feature.classList.add("touching");
        held = null; lift(cardAt(e.clientX));
      });
      feature.addEventListener("pointermove", function (e) {
        if (e.pointerType === "mouse" || !feature.classList.contains("touching")) return;
        if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) moved = true;
        var card = cardAt(e.clientX);
        if (card) lift(card);
      });
      feature.addEventListener("pointerup", function () { setTimeout(release, 180); });
      feature.addEventListener("pointercancel", release);
      feature.addEventListener("contextmenu", function (e) { if (feature.classList.contains("touching")) e.preventDefault(); });
      feature.addEventListener("click", function (e) { if (moved) { e.preventDefault(); moved = false; } });

      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        addEventListener("pointermove", function (e) {
          root.style.setProperty("--px", ((e.clientX / innerWidth) - .5) * 30);
          root.style.setProperty("--py", ((e.clientY / innerHeight) - .5) * 30);
        });
      }
    })();
  </script>
</body>
</html>
