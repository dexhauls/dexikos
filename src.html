<!doctype html>
<html lang="en" class="in">
<head>
  <meta charset="utf-8">
  <!-- Bez JavaScriptu zůstává obsah vidět; s ním se schová a najede animací. -->
  <script>document.documentElement.classList.remove("in");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dex (@dex_hauls)</title>
  <meta name="description" content="Professional hauler. I find the best reps, check the QC and show you what's actually worth buying.">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Dex (@dex_hauls)">
  <meta property="og:description" content="Professional hauler. I find the best reps, check the QC and show you what's actually worth buying.">
  <meta property="og:image" content="https://dexikos.com/pfp.webp">
  <meta property="og:url" content="https://dexikos.com/">
  <link rel="canonical" href="https://dexikos.com/">
  <link rel="icon" href="pfp.webp">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #171717;
      --tile: #f1f2f0;
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      font-family: "DM Sans", Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background: #0d0d0d;
      color: #fff;
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: max(44px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      display: grid;
      gap: 22px;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* Profil */
    .who { display: grid; justify-items: center; text-align: center; gap: 0; }
    .avatar {
      width: 104px; height: 104px; border-radius: 999px;
      padding: 3px;
      background: conic-gradient(from 200deg, #fff, rgb(255 255 255 / .15), #fff, rgb(255 255 255 / .15), #fff);
      animation: ring 8s linear infinite;
      margin-bottom: 16px;
    }
    .avatar img { display: block; width: 100%; height: 100%; border-radius: 999px; object-fit: cover; border: 3px solid #0d0d0d; animation: ring 8s linear infinite reverse; }
    @keyframes ring { to { rotate: 360deg; } }
    h1 { margin: 0; font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -.05em; }
    .handle { margin: 6px 0 0; font-size: 15px; font-weight: 400; color: rgb(255 255 255 / .55); }
    .bio { margin: 14px 0 0; max-width: 310px; font-size: 16px; line-height: 1.45; color: rgb(255 255 255 / .82); }

    .icons { display: flex; justify-content: center; gap: 10px; }
    .icon {
      width: 50px; height: 50px; border-radius: 999px;
      display: grid; place-items: center;
      background: rgb(255 255 255 / .07);
      border: 1px solid rgb(255 255 255 / .1);
      transition: transform .45s var(--spring), background .25s, color .25s;
    }
    .icon svg { width: 21px; height: 21px; }
    .icon:hover { background: #fff; color: var(--ink); transform: translateY(-3px) rotate(-6deg); }
    .icon:active { transform: scale(.92); }

    /* Dlaždice Dex Finds s rukou findů */
    .feature {
      position: relative; display: block;
      border-radius: 28px;
      background: rgb(255 255 255 / .06);
      border: 1px solid rgb(255 255 255 / .08);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform .45s var(--spring), background .25s;
    }
    .feature:hover { background: rgb(255 255 255 / .09); }
    .feature:active { transform: scale(.98); }
    .hand { position: relative; display: block; height: 212px; }
    .card {
      --gap: 0px; --rot: 0deg; --lift: 0px; --sc: .9;
      position: absolute; left: 50%; top: 52%;
      width: 108px; height: 138px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 30px -18px rgb(0 0 0 / .7), 0 1px 2px rgb(0 0 0 / .2);
      display: grid; place-items: center;
      opacity: 0;
      transform: translate(-50%, -50%) translateX(calc(var(--i) * var(--gap))) translateY(calc(var(--y) + 70px - var(--lift))) rotate(calc(var(--i) * var(--rot))) scale(var(--sc));
      transition: transform .7s var(--spring), opacity .5s var(--ease), filter .3s;
      transition-delay: calc(300ms + var(--k) * 70ms);
    }
    .card img { width: 88%; height: 88%; object-fit: contain; pointer-events: none; }
    .in .card { --gap: 48px; --rot: 7deg; --sc: 1; opacity: 1; transform: translate(-50%, -50%) translateX(calc(var(--i) * var(--gap))) translateY(calc(var(--y) - var(--lift))) rotate(calc(var(--i) * var(--rot))) scale(var(--sc)); }
    .in.ready .card { transition-delay: 0ms; }
    .in.ready .feature:hover .card, .in.ready .feature.open .card { --gap: 62px; --rot: 10deg; }
    .in.ready .feature:hover .card:not(:hover) { filter: opacity(.55); }
    .in.ready .card:hover { --lift: 20px; --sc: 1.07; z-index: 9; }
    .feature-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 12px 12px 22px; }
    .feature-title { font-size: 20px; font-weight: 400; letter-spacing: -.02em; }
    .feature-title small { display: block; margin-top: 2px; font-size: 13px; font-weight: 300; letter-spacing: 0; color: rgb(255 255 255 / .55); }

    /* Odkazy */
    nav { display: grid; gap: 10px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      height: 64px; padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgb(255 255 255 / .16);
      font-size: 17px; font-weight: 400; letter-spacing: -.01em;
      transition: transform .45s var(--spring), background .25s;
    }
    .link:hover { background: rgb(255 255 255 / .06); }
    .link:active { transform: scale(.97); }
    .link.primary { background: #fff; color: var(--ink); border-color: #fff; }
    .ic { flex: none; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: rgb(255 255 255 / .08); }
    .primary .ic { background: var(--tile); }
    .ic svg { width: 21px; height: 21px; }
    .label { flex: 1; min-width: 0; }
    .tag { flex: none; padding: 5px 10px; border-radius: 999px; background: var(--tile); font-size: 13px; font-weight: 500; }
    .go { flex: none; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: rgb(255 255 255 / .08); transition: transform .5s var(--spring), background .25s, color .25s; }
    .go svg { width: 18px; height: 18px; }
    .primary .go, .feature .go { background: #fff; color: var(--ink); }
    .primary .go { background: var(--ink); color: #fff; }
    .link:hover .go, .feature:hover .go { transform: rotate(45deg); }
    .link:not(.primary):hover .go { background: #fff; color: var(--ink); }

    footer { text-align: center; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: #767676; }

    /* Vstup */
    .rise { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .8s var(--spring); transition-delay: calc(120ms + var(--d, 0) * 70ms); }
    .in .rise { opacity: 1; transform: none; }

    .glow { position: fixed; inset: -20% -20% auto; height: 70vh; background: radial-gradient(50% 50% at 50% 50%, rgb(255 255 255 / .09), transparent 70%); pointer-events: none; }

    /* Oblečení vznášející se v pozadí, hýbe se za prstem/myší */
    .float { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .float img {
      position: absolute; width: var(--w); max-width: 420px; left: var(--x); top: var(--t);
      filter: blur(var(--b)) brightness(.8);
      opacity: .38;
      transform: translate(calc(var(--px, 0) * var(--z) * 1px), calc(var(--py, 0) * var(--z) * 1px)) rotate(var(--r));
      transition: transform 1.2s var(--ease);
      animation: drift 9s ease-in-out infinite alternate; animation-delay: var(--dl);
    }
    @keyframes drift { to { translate: 0 -16px; rotate: 4deg; } }

    @media (min-width: 700px) {
      main { padding-top: 72px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="float" aria-hidden="true">
    <img src="finds/maya.webp" alt="" style="--w:46vw;--x:-12vw;--t:6vh;--r:-14deg;--b:2px;--z:-1.2;--dl:-2s">
    <img src="finds/tn.webp" alt="" style="--w:50vw;--x:62vw;--t:58vh;--r:18deg;--b:1px;--z:.9;--dl:-5s">
    <img src="finds/bogo.webp" alt="" style="--w:40vw;--x:70vw;--t:-4vh;--r:12deg;--b:3px;--z:-.6;--dl:-1s">
    <img src="finds/cactus.webp" alt="" style="--w:48vw;--x:-16vw;--t:72vh;--r:-8deg;--b:2px;--z:1.4;--dl:-7s">
  </div>
  <main>
    <header class="who">
      <div class="avatar rise" style="--d:0"><img src="pfp.webp" alt="Dex" width="320" height="320"></div>
      <h1 class="rise" style="--d:1">Dex</h1>
      <p class="handle rise" style="--d:1">@dex_hauls</p>
      <p class="bio rise" style="--d:2">Professional hauler. I find the best reps, check the QC and show you what's actually worth buying.</p>
    </header>

    <div class="icons rise" style="--d:3">
      <a class="icon" href="https://www.instagram.com/dex_hauls/" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%INSTAGRAM%%"/></svg></a>
      <a class="icon" href="https://www.tiktok.com/@dex_hauls" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%TIKTOK%%"/></svg></a>
      <a class="icon" href="https://www.youtube.com/@Dex_hauls" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%YOUTUBE%%"/></svg></a>
      <a class="icon" href="https://discord.gg/dexhauls" aria-label="Discord"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%DISCORD%%"/></svg></a>
    </div>

    <a class="feature rise" href="https://update.dexfinds.com/?ref=bio" data-site style="--d:4">
      <span class="hand" aria-hidden="true">
        <span class="card" style="--i:-2;--y:18px;--k:0"><img src="finds/maya.webp" alt=""></span>
        <span class="card" style="--i:-1;--y:5px;--k:1"><img src="finds/cactus.webp" alt=""></span>
        <span class="card" style="--i:0;--y:0px;--k:2"><img src="finds/bogo.webp" alt=""></span>
        <span class="card" style="--i:1;--y:5px;--k:3"><img src="finds/tn.webp" alt=""></span>
        <span class="card" style="--i:2;--y:18px;--k:4"><img src="finds/af1.webp" alt=""></span>
      </span>
      <span class="feature-bar">
        <span class="feature-title">Dex Finds<small>All my finds with QC photos</small></span>
        <span class="go">%%ARROW%%</span>
      </span>
    </a>

    <nav aria-label="Links">
      <a class="link primary rise" href="https://ikako.vip/r/dexikos" rel="sponsored" style="--d:5">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg></span>
        <span class="label">Join KakoBuy</span>
        <span class="tag">$410</span>
        <span class="go">%%ARROW%%</span>
      </a>
      <a class="link rise" href="https://discord.gg/dexhauls" style="--d:6">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="%%DISCORD%%"/></svg></span>
        <span class="label">Discord server</span>
        <span class="go">%%ARROW%%</span>
      </a>
    </nav>

    <footer class="rise" style="--d:7">© Dex Finds</footer>
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      // ?ref= z bia (tiktok, ig…) jde dál na DexFinds, ať analytika ví, odkud návštěva přišla.
      try {
        var ref = new URLSearchParams(location.search).get("ref");
        if (ref && /^[\w-]{1,32}$/.test(ref)) {
          document.querySelectorAll("[data-site]").forEach(function (a) {
            var url = new URL(a.href); url.searchParams.set("ref", ref); a.href = url.toString();
          });
        }
      } catch (e) {}

      requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add("in"); }); });
      // Skrytá karta prohlížeče rAF nespouští; obsah se ukáže i tak.
      setTimeout(function () { root.classList.add("in"); }, 500);
      setTimeout(function () { root.classList.add("ready"); }, 1300);

      // Na telefonu bez myši se ruka po vstupu sama rozevře.
      if (matchMedia("(hover: none)").matches) {
        setTimeout(function () { document.querySelector(".feature").classList.add("open"); }, 1500);
      }

      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        addEventListener("pointermove", function (e) {
          root.style.setProperty("--px", ((e.clientX / innerWidth) - .5) * 30);
          root.style.setProperty("--py", ((e.clientY / innerHeight) - .5) * 30);
        });
      }
    })();
  </script>
</body>
</html>
